# Builds a test APK in the cloud on every push (no Android Studio needed).
# Download it from: GitHub > Actions > latest run > Artifacts > little-animals-apk
name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # USE_TEST_ADS shows Google's test ads only. Safe for testing.
      - name: Build APK
        run: flutter build apk --release --dart-define=USE_TEST_ADS=true

      - uses: actions/upload-artifact@v4
        with:
          name: little-animals-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
