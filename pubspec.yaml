name: animal_app
description: "Little Animals: learn 30 animals in Persian and English (ages 0-3)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    - assets/images/animals/
    - assets/audio/fa/
    - assets/audio/en/
    - assets/audio/animals/
    - assets/audio/music/
